version: 1
id: nop-01-healthy
seed: 101
timeoutSeconds: 15
contract: contracts/basic.yaml
provider:
  responseModes:
    - deliver
actions:
  - method: POST
    path: /test/pay
    body:
      logicalPayment: 11111111-1111-1111-1111-111111111101
      amountMinor: 1250
observations:
  - id: payment
    path: /test/state
    timeoutMs: 5000
    intervalMs: 50
assertions:
  - id: one-request
    kind: provider_request_count
    comparator: eq
    expected: 1
  - id: one-attempt
    kind: provider_attempt_count
    comparator: eq
    expected: 1
  - id: one-economic-effect
    kind: provider_effect_count
    comparator: eq
    expected: 1
  - id: paid
    kind: observation
    observation: payment
    pointer: /paymentStatus
    comparator: eq
    expected: Paid
  - id: one-paid-event
    kind: observation
    observation: payment
    pointer: /orderPaidEventCount
    comparator: eq
    expected: 1
