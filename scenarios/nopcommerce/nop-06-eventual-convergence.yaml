version: 1
id: nop-06-eventual-convergence
seed: 106
timeoutSeconds: 15
contract: contracts/basic.yaml
provider:
  responseModes: [abort_after_commit]
actions:
  - method: POST
    path: /test/pay
    body:
      logicalPayment: 66666666-6666-6666-6666-666666666606
      amountMinor: 1250
      retryOnAmbiguity: false
webhooks:
  path: /test/webhook
  events:
    - { id: nop06-succeeded, type: payment.succeeded, attemptOrdinal: 1 }
  deliveries:
    - { eventId: nop06-succeeded, delayMs: 500 }
observations:
  - { id: payment, path: /test/state, timeoutMs: 6000, intervalMs: 50 }
assertions:
  - { id: one-request, kind: provider_request_count, comparator: eq, expected: 1 }
  - { id: one-attempt, kind: provider_attempt_count, comparator: eq, expected: 1 }
  - { id: one-economic-effect, kind: provider_effect_count, comparator: eq, expected: 1 }
  - { id: one-webhook, kind: webhook_delivery_count, comparator: eq, expected: 1 }
  - { id: one-ack, kind: webhook_acked_count, comparator: eq, expected: 1 }
  - { id: paid, kind: observation, observation: payment, pointer: /paymentStatus, comparator: eq, expected: Paid }
  - { id: one-applied, kind: observation, observation: payment, pointer: /webhookAppliedCount, comparator: eq, expected: 1 }
  - { id: one-paid-event, kind: observation, observation: payment, pointer: /orderPaidEventCount, comparator: eq, expected: 1 }
