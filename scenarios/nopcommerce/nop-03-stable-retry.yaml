version: 1
id: nop-03-stable-retry
seed: 103
timeoutSeconds: 15
contract: contracts/basic.yaml
provider:
  responseModes:
    - abort_after_commit
    - deliver
actions:
  - method: POST
    path: /test/pay
    body:
      logicalPayment: 33333333-3333-3333-3333-333333333303
      amountMinor: 1250
      retryOnAmbiguity: true
observations:
  - id: payment
    path: /test/state
    timeoutMs: 5000
    intervalMs: 50
assertions:
  - id: two-requests
    kind: provider_request_count
    comparator: eq
    expected: 2
  - id: one-attempt
    kind: provider_attempt_count
    comparator: eq
    expected: 1
  - id: one-economic-effect
    kind: provider_effect_count
    comparator: eq
    expected: 1
  - id: one-key
    kind: distinct_idempotency_key_count
    comparator: eq
    expected: 1
  - id: paid
    kind: observation
    observation: payment
    pointer: /paymentStatus
    comparator: eq
    expected: Paid
  - id: one-paid-event
    kind: observation
    observation: payment
    pointer: /orderPaidEventCount
    comparator: eq
    expected: 1
