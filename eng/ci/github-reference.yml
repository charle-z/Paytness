name: Paytness nopCommerce reference

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paytness-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run real reference gate
        run: ./reference/nopcommerce/run.sh
